[project]
name = "myai-core-backend"
version = "0.1.0"
description = "Backend for the Personal AI Assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "email-validator>=2,<3",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "passlib[bcrypt]>=1.7.4,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pymilvus>=2.4,<3",
    "PyJWT>=2,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-dotenv>=1,<2",
    "sentence-transformers>=3,<6",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
    # Passlib 1.7.4's bcrypt backend self-test is incompatible with bcrypt 5.
    "bcrypt>=4,<4.1",
    "pytest-asyncio>=1.4.1",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false
