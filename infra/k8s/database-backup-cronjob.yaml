apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - pg_dump --no-owner "$DATABASE_URL" | gzip > /backup/database.sql.gz
              envFrom:
                - secretRef: {name: backend-secrets}
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              persistentVolumeClaim: {claimName: database-backups}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: database-backups}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 100Gi}
  storageClassName: encrypted-backup-storage
