services:
  backend:
    build:
      context: ../backend
    environment:
      LLM_MODE: ${LLM_MODE:-http_tgi}
      TGI_ENDPOINT: ${TGI_ENDPOINT:-http://host.docker.internal:8080/generate}
      LLAMA_BINARY_PATH: ${LLAMA_BINARY_PATH:-/usr/local/bin/llama-cli}
      LLAMA_MODEL_PATH: ${LLAMA_MODEL_PATH:-/models/model.gguf}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_MAX_NEW_TOKENS: ${LLM_MAX_NEW_TOKENS:-256}
      DATABASE_URL: postgresql+psycopg://assistant:assistant@postgres:5432/assistant
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      MILVUS_URI: ${MILVUS_URI:-http://host.docker.internal:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-documents}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["data"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  traefik:
    profiles: ["proxy"]
    image: traefik:v3.0
    command:
      - --api.insecure=true
      - --providers.docker=false
      - --entrypoints.web.address=:80
    ports:
      - "8080:8080"
      - "8081:80"

volumes:
  postgres_data:
