services:
  backend:
    build:
      context: ../backend
    environment:
      LLM_MODE: ${LLM_MODE:-http_tgi}
      TGI_ENDPOINT: ${TGI_ENDPOINT:-http://host.docker.internal:8080/generate}
      LLAMA_BINARY_PATH: ${LLAMA_BINARY_PATH:-/usr/local/bin/llama-cli}
      LLAMA_MODEL_PATH: ${LLAMA_MODEL_PATH:-/models/model.gguf}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_MAX_NEW_TOKENS: ${LLM_MAX_NEW_TOKENS:-256}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://assistant:assistant@postgres:5432/assistant}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      MILVUS_URI: ${MILVUS_URI:-http://milvus-standalone:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-documents}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus-standalone:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../frontend
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-assistant} -d $${POSTGRES_DB:-assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["data"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Milvus Standalone
  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: ["/usr/local/bin/etcd", "--allow-none-authentication=true"]
    ports:
      - "2379:2379"

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: ["server", "/data"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  traefik:
    profiles: ["proxy"]
    image: traefik:v3.0
    command:
      - --api.insecure=true
      - --providers.docker=false
      - --entrypoints.web.address=:80
    ports:
      - "8080:8080"
      - "8081:80"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
