name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v1

    - name: Install dependencies
      run: uv sync --project backend --group dev

    - name: Run Linters
      run: |
        uv run --project backend isort .
        uv run --project backend black --check .
        uv run --project backend flake8 backend

    - name: Run Tests
      run: uv run --project backend pytest backend/tests
